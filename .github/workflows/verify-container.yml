name: Verify AE container

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "GHCR image digest (sha256:...)"
        required: true
        type: string
      run_profile:
        description: "AE run profile"
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read
  packages: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Record host resources
        run: |
          lscpu
          free -h
          df -h .

      - name: Pull immutable image
        env:
          IMAGE: ghcr.io/xjtuiair-cag/ldp-gem5@${{ inputs.image_digest }}
        run: |
          docker pull "$IMAGE"

      - name: Reproduce nine tasks
        env:
          IMAGE: ghcr.io/xjtuiair-cag/ldp-gem5@${{ inputs.image_digest }}
        run: |
          mkdir results
          /usr/bin/time -v docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/results:/results" \
            "$IMAGE" \
            --run-profile "${{ inputs.run_profile }}" --jobs 4
          test -s "results/${{ inputs.run_profile }}/analysis/mechanism.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-${{ inputs.run_profile }}-results
          path: results
          retention-days: 30
